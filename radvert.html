<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="refresh" content="2; url=$(link-orig)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />   
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet hotspot - Advertisement</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        var popup = '';
        function openOrig() {
            if (window.focus) popup.focus();
            location.href = unescape('$(link-orig-esc)');
        }
        function openAd() {
            location.href = unescape('$(link-redirect-esc)');
        }
        function openAdvert() {
            if (window.name != 'hotspot_advert') {
                popup = open('$(link-redirect)', 'hotspot_advert', '');
                setTimeout("openOrig()", 1000);
                return;
            }
            setTimeout("openAd()", 1000);
        }
    </script>
</head>

<body onLoad="openAdvert()">
    <div class="scanlines"></div>

    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap animated fadeIn" style="text-align: center;">
                <div class="status-badge">
                    <span class="pulse-dot"></span> SPONSORED
                </div>

                <h1 class="glitch-hover">ADVERTISEMENT</h1>
                
                <div class="cyber-spinner"></div>

                <p class="info">If nothing happens, open <a class="cyber-link" href="$(link-redirect)" target="hotspot_advert">advertisement</a> manually.</p>

                <p class="info bt glitch-hover">HOTSPOT GATEWAY &bull; MIKROTIK ROUTEROS</p>
            </div>
        </div>
    </div>
    <script src="glitch.js"></script>
</body>

</html>
