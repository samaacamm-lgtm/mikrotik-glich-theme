<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>MISSION // 2777 - RED GLITCH AIR COMBAT</title>
    <style>
        /* ==========================================================================
           Retro 2777 Air Force - Standalone Arcade Page
           2-Color: Black (#050204) & Red Neon (#ff1744)
           ========================================================================== */

        :root {
            --bg-dark: #050204;
            --neon-red: #ff1744;
            --neon-crimson: #d50032;
            --neon-glow: #ff0055;
            --neon-bright: #ff4569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050204;
            color: #ffffff;
            font-family: monospace;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Full-screen arcade layout */
        .arcade-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 30%, rgba(213, 0, 50, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.08) 0%, transparent 50%),
                #050204;
            position: relative;
        }

        /* CRT Scanlines over entire page */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.35) 50%);
            background-size: 100% 3px;
            opacity: 0.6;
        }

        /* Header */
        .retro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 520px;
            padding: 10px 16px;
            background: rgba(26, 6, 14, 0.95);
            border: 1.5px solid rgba(255, 23, 68, 0.5);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            z-index: 10;
        }

        .retro-title {
            display: flex;
            flex-direction: column;
        }

        .retro-tag {
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px #ff1744;
        }

        .retro-subtitle {
            color: var(--neon-bright);
            font-size: 9.5px;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .retro-controls-bar {
            display: flex;
            gap: 8px;
        }

        .retro-hud-btn {
            background: rgba(255, 23, 68, 0.15);
            border: 1px solid var(--neon-red);
            color: #ffffff;
            font-family: monospace;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .retro-hud-btn:hover {
            background: var(--neon-red);
            box-shadow: 0 0 12px #ff1744;
        }

        .retro-hud-btn.muted {
            opacity: 0.5;
        }

        .retro-exit-btn {
            background: #ff1744;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        /* Canvas Container */
        .retro-canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
            background: #050204;
            border-left: 1.5px solid rgba(255, 23, 68, 0.5);
            border-right: 1.5px solid rgba(255, 23, 68, 0.5);
            box-shadow: 0 0 40px rgba(255, 23, 68, 0.4), inset 0 0 20px rgba(255, 23, 68, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Mobile Bomb Button */
        .retro-mobile-controls {
            position: absolute;
            bottom: 12px;
            right: 15px;
            z-index: 10;
            display: none;
        }

        @media (pointer: coarse) {
            .retro-mobile-controls { display: block; }
        }

        .mobile-bomb-btn {
            background: rgba(255, 23, 68, 0.35);
            border: 2px solid var(--neon-red);
            color: #ffffff;
            font-family: monospace;
            font-weight: 800;
            font-size: 14px;
            padding: 12px 20px;
            border-radius: 22px;
            box-shadow: 0 0 18px rgba(255, 23, 68, 0.6);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* Footer */
        .retro-footer {
            width: 100%;
            max-width: 520px;
            padding: 10px 14px;
            background: rgba(18, 5, 12, 0.95);
            border: 1.5px solid rgba(255, 23, 68, 0.5);
            border-top: none;
            border-radius: 0 0 12px 12px;
            color: rgba(199, 168, 180, 0.85);
            font-size: 10.5px;
            text-align: center;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        @media (max-width: 540px) {
            .retro-header, .retro-canvas-wrapper, .retro-footer {
                max-width: 100%;
                border-radius: 0;
            }
            .retro-header { border-top: none; }
            .retro-footer { border-bottom: none; }
        }

        /* Glitch Background Canvas */
        #glitch-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <canvas id="glitch-bg"></canvas>

    <div class="arcade-wrapper">
        <!-- Header -->
        <div class="retro-header">
            <div class="retro-title">
                <span class="retro-tag">MISSION // 2777</span>
                <span class="retro-subtitle">RED GLITCH AIR COMBAT</span>
            </div>
            <div class="retro-controls-bar">
                <button class="retro-hud-btn" id="mute-btn">SOUND: ON</button>
                <a class="retro-hud-btn retro-exit-btn" id="exit-btn" href="javascript:history.back()">&times; EXIT</a>
            </div>
        </div>

        <!-- Game Canvas -->
        <div class="retro-canvas-wrapper">
            <canvas id="game-canvas" width="480" height="640"></canvas>
            <div class="retro-mobile-controls">
                <button class="mobile-bomb-btn" id="mobile-bomb-btn">💣 BOMB [X]</button>
            </div>
        </div>

        <!-- Footer -->
        <div class="retro-footer">
            <span>[WASD / ARROWS] MOVE</span> &bull;
            <span>[SPACE] FIRE</span> &bull;
            <span>[X] GLITCH BOMB</span> &bull;
            <span>[TOUCH DRAG] MOBILE</span>
        </div>
    </div>

<script>
// ==========================================================================
// RETRO AIR FORCE 2777 — Standalone 2-Color (Black & Red) Arcade Engine
// ==========================================================================
(function () {
    'use strict';

    // ── Glitch Background ────────────────────────────────────────────
    var gbg = document.getElementById('glitch-bg');
    var gbgCtx = gbg.getContext('2d');
    var bgParticles = [];

    function resizeBg() {
        gbg.width = window.innerWidth;
        gbg.height = window.innerHeight;
        bgParticles = [];
        for (var i = 0; i < 30; i++) {
            bgParticles.push({
                x: Math.random() * gbg.width,
                y: Math.random() * gbg.height,
                vy: -(Math.random() * 1.2 + 0.3),
                size: Math.random() * 2 + 1,
                a: Math.random() * 0.6 + 0.3
            });
        }
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    function drawBg() {
        requestAnimationFrame(drawBg);
        gbgCtx.clearRect(0, 0, gbg.width, gbg.height);
        // grid
        gbgCtx.strokeStyle = 'rgba(255,23,68,0.04)';
        gbgCtx.lineWidth = 1;
        for (var x = 0; x < gbg.width; x += 40) { gbgCtx.beginPath(); gbgCtx.moveTo(x,0); gbgCtx.lineTo(x,gbg.height); gbgCtx.stroke(); }
        for (var y = 0; y < gbg.height; y += 40) { gbgCtx.beginPath(); gbgCtx.moveTo(0,y); gbgCtx.lineTo(gbg.width,y); gbgCtx.stroke(); }
        // particles
        for (var i = 0; i < bgParticles.length; i++) {
            var p = bgParticles[i];
            p.y += p.vy;
            if (p.y < 0) { p.y = gbg.height; p.x = Math.random() * gbg.width; }
            gbgCtx.fillStyle = 'rgba(255,23,68,' + p.a + ')';
            gbgCtx.beginPath();
            gbgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            gbgCtx.fill();
        }
        // random glitch
        if (Math.random() < 0.15) {
            var sy = Math.random() * gbg.height;
            gbgCtx.fillStyle = 'rgba(255,23,68,' + (Math.random() * 0.3 + 0.1) + ')';
            gbgCtx.fillRect(0, sy, gbg.width, Math.random() * 18 + 3);
        }
    }
    drawBg();

    // ── Audio Engine (Web Audio API 8-bit synth & BGM Engine) ────────
    var audioCtx = null;
    var isMuted = false;
    var bgmGainNode = null;
    var bgmStep = 0;
    var nextBgmTime = 0;
    var isBgmPlaying = false;

    function getAudio() {
        if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    // Musical Frequencies (Hz) for Chiptune Synthwave BGM
    var NOTE = {
        C2: 65.41, D2: 73.42, Eb2: 77.78, E2: 82.41, F2: 87.31, G2: 98.00, Ab2: 103.83, A2: 110.00, Bb2: 116.54, B2: 123.47,
        C3: 130.81, D3: 146.83, Eb3: 155.56, E3: 164.81, F3: 174.61, G3: 196.00, Ab3: 207.65, A3: 220.00, Bb3: 233.08, B3: 246.94,
        C4: 261.63, D4: 293.66, Eb4: 311.13, E4: 329.63, F4: 349.23, G4: 392.00, Ab4: 415.30, A4: 440.00, Bb4: 466.16, B4: 493.88,
        C5: 523.25, D5: 587.33, Eb5: 622.25, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, Bb5: 932.33,
        OFF: 0
    };

    // Stage Theme Pattern (32 16th-note steps in D-Minor / Cyberpunk Synthwave)
    var stageBass = [
        NOTE.D2, NOTE.D2, NOTE.D3, NOTE.D2,  NOTE.F2, NOTE.F2, NOTE.F3, NOTE.F2,
        NOTE.G2, NOTE.G2, NOTE.G3, NOTE.G2,  NOTE.A2, NOTE.G2, NOTE.F2, NOTE.E2,
        NOTE.D2, NOTE.D2, NOTE.D3, NOTE.D2,  NOTE.Bb2, NOTE.Bb2, NOTE.Bb3, NOTE.Bb2,
        NOTE.C3, NOTE.C3, NOTE.C4, NOTE.C3,  NOTE.A2, NOTE.Bb2, NOTE.C3, NOTE.A2
    ];

    var stageMelody = [
        NOTE.D4, NOTE.OFF, NOTE.F4, NOTE.OFF, NOTE.A4, NOTE.OFF, NOTE.D5, NOTE.OFF,
        NOTE.C5, NOTE.OFF, NOTE.A4, NOTE.OFF, NOTE.F4, NOTE.G4, NOTE.A4, NOTE.OFF,
        NOTE.F4, NOTE.OFF, NOTE.D4, NOTE.OFF, NOTE.G4, NOTE.OFF, NOTE.F4, NOTE.E4,
        NOTE.D4, NOTE.OFF, NOTE.A4, NOTE.OFF, NOTE.D5, NOTE.C5, NOTE.A4, NOTE.OFF
    ];

    // Boss Theme Pattern (150 BPM Driving Industrial Minor with rapid bass)
    var bossBass = [
        NOTE.D2, NOTE.D2, NOTE.Eb2, NOTE.D2, NOTE.D2, NOTE.F2, NOTE.D2, NOTE.G2,
        NOTE.D2, NOTE.D2, NOTE.Eb2, NOTE.D2, NOTE.Ab2, NOTE.G2, NOTE.F2, NOTE.Eb2,
        NOTE.D2, NOTE.D2, NOTE.Eb2, NOTE.D2, NOTE.D2, NOTE.F2, NOTE.D2, NOTE.G2,
        NOTE.Bb2, NOTE.A2, NOTE.G2, NOTE.F2, NOTE.Eb2, NOTE.D2, NOTE.C2, NOTE.Eb2
    ];

    var bossMelody = [
        NOTE.D5, NOTE.D5, NOTE.OFF, NOTE.Eb5, NOTE.D5, NOTE.OFF, NOTE.A4, NOTE.OFF,
        NOTE.F5, NOTE.OFF, NOTE.D5, NOTE.OFF, NOTE.Ab4, NOTE.G4, NOTE.F4, NOTE.OFF,
        NOTE.D5, NOTE.OFF, NOTE.F5, NOTE.OFF, NOTE.G5, NOTE.OFF, NOTE.A5, NOTE.OFF,
        NOTE.Bb5, NOTE.A5, NOTE.G5, NOTE.F5, NOTE.Eb5, NOTE.D5, NOTE.Eb5, NOTE.D5
    ];

    function initBGM() {
        var c = getAudio();
        if (!c) return;
        if (!bgmGainNode) {
            bgmGainNode = c.createGain();
            bgmGainNode.gain.setValueAtTime(isMuted ? 0 : 0.22, c.currentTime);
            bgmGainNode.connect(c.destination);
        }
        if (!isBgmPlaying) {
            isBgmPlaying = true;
            nextBgmTime = c.currentTime + 0.05;
            scheduleBGM();
        }
    }

    function scheduleBGM() {
        if (!isBgmPlaying) return;
        var c = getAudio();
        if (!c) return;

        var bpm = (bossActive && boss) ? 150 : 134;
        var stepDuration = (60 / bpm) / 4; // 16th note step in seconds

        while (nextBgmTime < c.currentTime + 0.25) {
            var step = bgmStep % 32;
            var isBoss = !!(bossActive && boss);

            var bassNote = isBoss ? bossBass[step] : stageBass[step];
            var leadNote = isBoss ? bossMelody[step] : stageMelody[step];

            if (!isMuted && bgmGainNode) {
                // 1. Bassline synth (rich low-pass filtered sawtooth)
                if (bassNote && bassNote > 0) {
                    var oscB = c.createOscillator();
                    var gainB = c.createGain();
                    var filterB = c.createBiquadFilter();

                    oscB.type = 'sawtooth';
                    oscB.frequency.setValueAtTime(bassNote, nextBgmTime);

                    filterB.type = 'lowpass';
                    filterB.frequency.setValueAtTime(isBoss ? 900 : 650, nextBgmTime);
                    filterB.frequency.exponentialRampToValueAtTime(120, nextBgmTime + stepDuration * 0.9);

                    gainB.gain.setValueAtTime(0.32, nextBgmTime);
                    gainB.gain.exponentialRampToValueAtTime(0.001, nextBgmTime + stepDuration * 0.95);

                    oscB.connect(filterB);
                    filterB.connect(gainB);
                    gainB.connect(bgmGainNode);

                    oscB.start(nextBgmTime);
                    oscB.stop(nextBgmTime + stepDuration * 0.95);
                }

                // 2. Lead Melody synth (Square wave chiptune)
                if (leadNote && leadNote > 0) {
                    var oscL = c.createOscillator();
                    var gainL = c.createGain();

                    oscL.type = 'square';
                    oscL.frequency.setValueAtTime(leadNote, nextBgmTime);

                    gainL.gain.setValueAtTime(0.14, nextBgmTime);
                    gainL.gain.exponentialRampToValueAtTime(0.001, nextBgmTime + stepDuration * 0.85);

                    oscL.connect(gainL);
                    gainL.connect(bgmGainNode);

                    oscL.start(nextBgmTime);
                    oscL.stop(nextBgmTime + stepDuration * 0.85);
                }

                // 3. Chiptune Percussion (Kick, Snare, Hi-hat)
                // Kick on beats 0, 4, 8, 12, 16, 20, 24, 28 (or every 4 steps)
                if (step % 4 === 0) {
                    var oscK = c.createOscillator();
                    var gainK = c.createGain();
                    oscK.type = 'sine';
                    oscK.frequency.setValueAtTime(140, nextBgmTime);
                    oscK.frequency.exponentialRampToValueAtTime(32, nextBgmTime + 0.09);
                    gainK.gain.setValueAtTime(0.38, nextBgmTime);
                    gainK.gain.exponentialRampToValueAtTime(0.001, nextBgmTime + 0.09);
                    oscK.connect(gainK);
                    gainK.connect(bgmGainNode);
                    oscK.start(nextBgmTime);
                    oscK.stop(nextBgmTime + 0.09);
                }

                // Snare / Clap on beats 4, 12, 20, 28
                if (step % 8 === 4) {
                    var bufSnare = c.createBuffer(1, Math.floor(c.sampleRate * 0.08), c.sampleRate);
                    var dataSn = bufSnare.getChannelData(0);
                    for (var s = 0; s < dataSn.length; s++) dataSn[s] = Math.random() * 2 - 1;
                    var noiseSn = c.createBufferSource();
                    noiseSn.buffer = bufSnare;
                    var filterSn = c.createBiquadFilter();
                    filterSn.type = 'bandpass';
                    filterSn.frequency.setValueAtTime(1400, nextBgmTime);
                    var gainSn = c.createGain();
                    gainSn.gain.setValueAtTime(0.20, nextBgmTime);
                    gainSn.gain.exponentialRampToValueAtTime(0.001, nextBgmTime + 0.08);
                    noiseSn.connect(filterSn);
                    filterSn.connect(gainSn);
                    gainSn.connect(bgmGainNode);
                    noiseSn.start(nextBgmTime);
                }

                // Hi-Hat on off-beats (every 2 steps)
                if (step % 2 === 1) {
                    var bufHh = c.createBuffer(1, Math.floor(c.sampleRate * 0.03), c.sampleRate);
                    var dataHh = bufHh.getChannelData(0);
                    for (var h = 0; h < dataHh.length; h++) dataHh[h] = Math.random() * 2 - 1;
                    var noiseHh = c.createBufferSource();
                    noiseHh.buffer = bufHh;
                    var filterHh = c.createBiquadFilter();
                    filterHh.type = 'highpass';
                    filterHh.frequency.setValueAtTime(7000, nextBgmTime);
                    var gainHh = c.createGain();
                    gainHh.gain.setValueAtTime(0.06, nextBgmTime);
                    gainHh.gain.exponentialRampToValueAtTime(0.001, nextBgmTime + 0.03);
                    noiseHh.connect(filterHh);
                    filterHh.connect(gainHh);
                    gainHh.connect(bgmGainNode);
                    noiseHh.start(nextBgmTime);
                }
            }

            nextBgmTime += stepDuration;
            bgmStep++;
        }

        requestAnimationFrame(scheduleBGM);
    }

    function snd(type) {
        if (isMuted) return;
        var c = getAudio();
        if (!c) return;
        var t = c.currentTime;

        if (type === 'shoot') {
            var o = c.createOscillator(), g = c.createGain();
            o.type = 'square';
            o.frequency.setValueAtTime(880, t);
            o.frequency.exponentialRampToValueAtTime(110, t + 0.12);
            g.gain.setValueAtTime(0.12, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            o.connect(g); g.connect(c.destination);
            o.start(t); o.stop(t + 0.12);
        } else if (type === 'enemy_shoot') {
            var o = c.createOscillator(), g = c.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(440, t);
            o.frequency.exponentialRampToValueAtTime(80, t + 0.15);
            g.gain.setValueAtTime(0.08, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            o.connect(g); g.connect(c.destination);
            o.start(t); o.stop(t + 0.15);
        } else if (type === 'explosion') {
            var bs = Math.floor(c.sampleRate * 0.25);
            var buf = c.createBuffer(1, bs, c.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
            var n = c.createBufferSource(); n.buffer = buf;
            var f = c.createBiquadFilter(); f.type = 'lowpass';
            f.frequency.setValueAtTime(600, t);
            f.frequency.exponentialRampToValueAtTime(40, t + 0.25);
            var g = c.createGain();
            g.gain.setValueAtTime(0.25, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            n.connect(f); f.connect(g); g.connect(c.destination);
            n.start(t);
        } else if (type === 'bomb') {
            var o = c.createOscillator(), g = c.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(200, t);
            o.frequency.exponentialRampToValueAtTime(30, t + 0.6);
            g.gain.setValueAtTime(0.35, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
            o.connect(g); g.connect(c.destination);
            o.start(t); o.stop(t + 0.6);
        } else if (type === 'powerup') {
            [440,554,659,880].forEach(function(freq, idx) {
                var o = c.createOscillator(), g = c.createGain();
                o.type = 'square';
                o.frequency.setValueAtTime(freq, t + idx * 0.05);
                g.gain.setValueAtTime(0.12, t + idx * 0.05);
                g.gain.exponentialRampToValueAtTime(0.001, t + (idx+1) * 0.05);
                o.connect(g); g.connect(c.destination);
                o.start(t + idx * 0.05); o.stop(t + (idx+1) * 0.05);
            });
        } else if (type === 'heal') {
            [523, 659, 784, 1046].forEach(function(freq, idx) {
                var o = c.createOscillator(), g = c.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(freq, t + idx * 0.04);
                g.gain.setValueAtTime(0.18, t + idx * 0.04);
                g.gain.exponentialRampToValueAtTime(0.001, t + (idx+1) * 0.05);
                o.connect(g); g.connect(c.destination);
                o.start(t + idx * 0.04); o.stop(t + (idx+1) * 0.05);
            });
        } else if (type === 'shield') {
            var o = c.createOscillator(), g = c.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(320, t);
            o.frequency.exponentialRampToValueAtTime(880, t + 0.22);
            g.gain.setValueAtTime(0.2, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
            o.connect(g); g.connect(c.destination);
            o.start(t); o.stop(t + 0.22);
        } else if (type === 'shield_hit') {
            var o = c.createOscillator(), g = c.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(360, t);
            o.frequency.exponentialRampToValueAtTime(140, t + 0.12);
            g.gain.setValueAtTime(0.15, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            o.connect(g); g.connect(c.destination);
            o.start(t); o.stop(t + 0.12);
        }
    }

    // ── Game State ───────────────────────────────────────────────────
    var canvas = document.getElementById('game-canvas');
    var ctx = canvas.getContext('2d');
    var CW = 480, CH = 640;
    var isTouchDevice = !!(window.matchMedia && !window.matchMedia('(hover: hover) and (pointer: fine)').matches);

    var score = 0;
    var highScore = parseInt(localStorage.getItem('retro2777hi') || '0', 10);
    var lives = 3, bombs = 2, wave = 1;
    var bossActive = false, boss = null;
    
    // 4-Phase Titan Dreadnought System:
    // Phase 0: 15,000 (Buritan Kapal / Stern Engines)
    // Phase 1: 30,000 (Lambung Kiri / Port Hull)
    // Phase 2: 45,000 (Lambung Kanan / Starboard Hull)
    // Phase 3: 55,000 (Haluan Kapal / Command Bow & Core)
    // Loop 2: 70,000, 85,000, 100,000, 110,000 ...
    var bossThresholds = [15000, 30000, 45000, 55000];
    var bossIndex = 0;
    var bossWarningTimer = 0;
    var bossDefeatedTimer = 0;
    var bossDefeatedText = '';
    var screenShake = 0, glitchTimer = 0;
    var spawnTimer = 0;

    function getNextBossScore() {
        var loop = Math.floor(bossIndex / 4);
        var phaseInLoop = bossIndex % 4;
        return bossThresholds[phaseInLoop] + loop * 55000;
    }

    var nextBossScore = 15000;

    var player = { x: 240, y: 540, speed: 5.5, weaponLevel: 1, shield: 0, inv: 0, cd: 0 };
    var bullets = [], eBullets = [], enemies = [], powerups = [], particles = [], stars = [];
    var keys = { left:false, right:false, up:false, down:false, shoot:false };

    function initStars() {
        stars = [];
        for (var i = 0; i < 45; i++) {
            stars.push({ x: Math.random()*CW, y: Math.random()*CH, s: Math.random()*2.5+1, sz: Math.random()>0.8?2:1, b: Math.random()*0.6+0.4 });
        }
    }

    function reset() {
        score = 0; lives = 3; bombs = 2; wave = 1;
        bossIndex = 0; nextBossScore = 15000;
        bossActive = false; boss = null;
        bossWarningTimer = 0; bossDefeatedTimer = 0;
        screenShake = 0; glitchTimer = 0; spawnTimer = 0;
        bullets = []; eBullets = []; enemies = []; powerups = []; particles = [];
        player.x = 240; player.y = 540; player.weaponLevel = 1; player.shield = 0; player.inv = 60; player.cd = 0;
        initStars();
    }

    // ── Input ────────────────────────────────────────────────────────
    document.addEventListener('keydown', function(e) {
        initBGM();
        var k = e.key;
        if (k==='ArrowLeft'||k==='a'||k==='A') keys.left=true;
        if (k==='ArrowRight'||k==='d'||k==='D') keys.right=true;
        if (k==='ArrowUp'||k==='w'||k==='W') keys.up=true;
        if (k==='ArrowDown'||k==='s'||k==='S') keys.down=true;
        if (k===' '||k==='z'||k==='Z') { keys.shoot=true; if(lives<=0) reset(); }
        if (k==='x'||k==='X'||k==='b'||k==='B'||k==='Enter') useBomb();
        if (k==='Escape') history.back();
    });

    document.addEventListener('keyup', function(e) {
        var k = e.key;
        if (k==='ArrowLeft'||k==='a'||k==='A') keys.left=false;
        if (k==='ArrowRight'||k==='d'||k==='D') keys.right=false;
        if (k==='ArrowUp'||k==='w'||k==='W') keys.up=false;
        if (k==='ArrowDown'||k==='s'||k==='S') keys.down=false;
        if (k===' '||k==='z'||k==='Z') keys.shoot=false;
    });

    // Touch controls
    var touching = false;
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        initBGM();
        touching = true; keys.shoot = true;
        moveToTouch(e);
        if (lives <= 0) reset();
    }, {passive:false});

    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (touching) moveToTouch(e);
    }, {passive:false});

    canvas.addEventListener('touchend', function() { touching = false; });

    function moveToTouch(e) {
        var r = canvas.getBoundingClientRect();
        var sx = CW / r.width, sy = CH / r.height;
        var t = e.touches[0];
        if (t) {
            player.x = (t.clientX - r.left) * sx;
            player.y = (t.clientY - r.top) * sy - 20;
        }
    }

    // Mobile bomb
    var bombBtn = document.getElementById('mobile-bomb-btn');
    bombBtn.addEventListener('touchstart', function(e) { e.preventDefault(); e.stopPropagation(); initBGM(); useBomb(); }, {passive:false});
    bombBtn.addEventListener('click', function(e) { e.preventDefault(); initBGM(); useBomb(); });

    // Mute toggle
    var muteBtn = document.getElementById('mute-btn');
    muteBtn.addEventListener('click', function() {
        isMuted = !isMuted;
        muteBtn.textContent = isMuted ? 'SOUND: OFF' : 'SOUND: ON';
        muteBtn.classList.toggle('muted', isMuted);
        if (bgmGainNode && audioCtx) {
            bgmGainNode.gain.setValueAtTime(isMuted ? 0 : 0.22, audioCtx.currentTime);
        }
        initBGM();
    });

    // Click canvas to init audio on first interaction
    canvas.addEventListener('click', function() { initBGM(); if(lives<=0) reset(); });

    // ── Game Logic ───────────────────────────────────────────────────
    function useBomb() {
        if (lives <= 0 || bombs <= 0) return;
        bombs--; snd('bomb');
        screenShake = 20; glitchTimer = 18;
        eBullets = [];
        for (var i = 0; i < enemies.length; i++) {
            enemies[i].hp -= 25;
            boom(enemies[i].x, enemies[i].y, 12);
        }
        for (var i = 0; i < 40; i++) {
            particles.push({ x:240,y:320, vx:(Math.random()-0.5)*16, vy:(Math.random()-0.5)*16, life:30, ml:30, sz:Math.random()*4+2 });
        }
    }

    function boom(x, y, n) {
        snd('explosion');
        screenShake = Math.max(screenShake, 5);
        for (var i = 0; i < n; i++) {
            var a = Math.random()*Math.PI*2, sp = Math.random()*5+1;
            particles.push({ x:x,y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:Math.random()*20+10, ml:30, sz:Math.random()*3+1.5 });
        }
    }

    function spark(x, y) {
        for (var i = 0; i < 3; i++)
            particles.push({ x:x,y:y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:8, ml:8, sz:2 });
    }

    function hitPlayer() {
        // Shield Absorption
        if (player.shield > 0) {
            player.shield--;
            player.inv = 50;
            snd('shield_hit');
            screenShake = 10;
            glitchTimer = 8;
            for (var i = 0; i < 18; i++) {
                var a = (i / 18) * Math.PI * 2;
                particles.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(a) * 6,
                    vy: Math.sin(a) * 6,
                    life: 18,
                    ml: 18,
                    sz: 3
                });
            }
            return;
        }

        lives--;
        player.inv = 90;
        player.weaponLevel = Math.max(1, player.weaponLevel - 1);
        boom(player.x, player.y, 25);
        screenShake = 18; glitchTimer = 15;
        if (lives <= 0) snd('explosion');
    }

    function spawning() {
        // 4-Phase Boss Spawn Check: 15k (Buritan), 30k (Lambung Kiri), 45k (Lambung Kanan), 55k (Haluan)
        if (score >= nextBossScore && !bossActive) {
            bossActive = true;
            bossWarningTimer = 150;
            screenShake = 26;
            glitchTimer = 25;
            snd('bomb');
            
            // Clear regular small enemies with a flash
            for (var k = 0; k < enemies.length; k++) {
                boom(enemies[k].x, enemies[k].y, 8);
            }
            enemies = [];
            eBullets = [];

            var phaseType = bossIndex % 4;
            var loop = Math.floor(bossIndex / 4);

            var phaseNames = [
                'FASE 1: BURITAN KAPAL (REAR ENGINES)',
                'FASE 2: LAMBUNG KIRI (PORT BROADSIDE)',
                'FASE 3: LAMBUNG KANAN (STARBOARD CARRIER)',
                'FASE 4: HALUAN UTAMA (COMMAND PROW & CORE)'
            ];

            var shortNames = [
                'BURITAN MK-' + (loop + 1),
                'LAMBUNG KIRI MK-' + (loop + 1),
                'LAMBUNG KANAN MK-' + (loop + 1),
                'HALUAN UTAMA MK-' + (loop + 1)
            ];

            var baseHps = [320, 380, 440, 560];
            var bHp = baseHps[phaseType] + loop * 260;

            // Spawn Position based on phase (flanks start from their respective sides!)
            var initX = phaseType === 1 ? 170 : (phaseType === 2 ? 310 : 240);

            boss = {
                type: 'boss',
                phaseType: phaseType,
                name: phaseNames[phaseType],
                shortName: shortNames[phaseType],
                tier: loop + 1,
                x: initX,
                y: -110,
                w: phaseType === 3 ? 280 : 250,
                h: phaseType === 3 ? 100 : 88,
                hp: bHp,
                maxHp: bHp,
                st: 0,
                dir: phaseType === 1 ? 1 : (phaseType === 2 ? -1 : 1),
                atkPattern: 0,
                subTimer: 0,
                chargeTimer: 0
            };
            enemies.push(boss);
            return;
        }

        if (bossActive) return;

        spawnTimer++;
        // Difficulty scaling: spawn rate increases with total boss defeats
        var spawnRate = Math.max(16, 52 - bossIndex * 5);
        if (spawnTimer <= spawnRate) return;
        spawnTimer = 0;

        var r = Math.random();
        var diff = bossIndex;

        if (r < 0.55) {
            // Scout Squad
            var sx = Math.random()*360+60;
            var scoutHp = 2 + Math.floor(diff * 0.7);
            var scoutSpeed = 3.2 + Math.min(diff * 0.35, 2.5);
            for (var i = 0; i < 3; i++) {
                enemies.push({
                    type: 'scout',
                    x: sx,
                    y: -30 - i * 45,
                    w: 24,
                    h: 24,
                    hp: scoutHp,
                    sy: scoutSpeed,
                    sX: Math.sin(i) * (1.5 + diff * 0.2),
                    st: Math.max(20, Math.random() * 30 + 30 - diff * 2)
                });
            }
        } else if (r < 0.82) {
            // Heavy Bomber (tougher in higher tiers)
            var bomberHp = 8 + diff * 3.5;
            var bomberSpeed = 1.4 + Math.min(diff * 0.2, 1.4);
            enemies.push({
                type: 'bomber',
                x: Math.random()*380+50,
                y: -50,
                w: 48,
                h: 38,
                hp: bomberHp,
                sy: bomberSpeed,
                sX: (Math.random()-0.5) * (1.2 + diff * 0.2),
                st: Math.max(18, 26 - diff * 2)
            });

            // Extra twin bomber in higher stages (tier 2+)
            if (diff >= 2 && Math.random() < 0.4) {
                enemies.push({
                    type: 'bomber',
                    x: Math.random()*380+50,
                    y: -90,
                    w: 48,
                    h: 38,
                    hp: bomberHp,
                    sy: bomberSpeed,
                    sX: (Math.random()-0.5) * 1.5,
                    st: 35
                });
            }
        } else {
            // Fast Interceptor
            var intHp = 3 + Math.floor(diff * 1.1);
            var intSpeed = 4.8 + Math.min(diff * 0.4, 3.0);
            enemies.push({
                type: 'interceptor',
                x: Math.random()*400+40,
                y: -30,
                w: 22,
                h: 22,
                hp: intHp,
                sy: intSpeed,
                sX: 0,
                tgt: false,
                spd: intSpeed
            });
        }
    }

    // ── Update ───────────────────────────────────────────────────────
    function update() {
        if (screenShake > 0) screenShake *= 0.85;
        if (glitchTimer > 0) glitchTimer--;
        if (bossWarningTimer > 0) bossWarningTimer--;
        if (bossDefeatedTimer > 0) bossDefeatedTimer--;

        for (var i = 0; i < stars.length; i++) {
            stars[i].y += stars[i].s;
            if (stars[i].y > CH) { stars[i].y = 0; stars[i].x = Math.random()*CW; }
        }

        if (lives <= 0) return;

        // Movement
        if (keys.left && player.x > 20) player.x -= player.speed;
        if (keys.right && player.x < 460) player.x += player.speed;
        if (keys.up && player.y > 30) player.y -= player.speed;
        if (keys.down && player.y < 610) player.y += player.speed;
        if (player.inv > 0) player.inv--;
        if (player.cd > 0) player.cd--;

        // Auto Shoot
        if (player.cd <= 0) {
            player.cd = 8; snd('shoot');
            if (player.weaponLevel === 1) {
                bullets.push({x:player.x-7,y:player.y-15,vx:0,vy:-12});
                bullets.push({x:player.x+7,y:player.y-15,vx:0,vy:-12});
            } else if (player.weaponLevel === 2) {
                bullets.push({x:player.x-10,y:player.y-15,vx:-1.5,vy:-12});
                bullets.push({x:player.x,y:player.y-18,vx:0,vy:-12});
                bullets.push({x:player.x+10,y:player.y-15,vx:1.5,vy:-12});
            } else {
                bullets.push({x:player.x-14,y:player.y-12,vx:-3,vy:-12});
                bullets.push({x:player.x-5,y:player.y-16,vx:-0.8,vy:-12});
                bullets.push({x:player.x+5,y:player.y-16,vx:0.8,vy:-12});
                bullets.push({x:player.x+14,y:player.y-12,vx:3,vy:-12});
            }
        }

        // Bullets
        for (var i = bullets.length-1; i >= 0; i--) {
            var b = bullets[i]; b.x += b.vx; b.y += b.vy;
            if (b.y < -20 || b.x < -20 || b.x > 500) bullets.splice(i,1);
        }

        // Enemy bullets
        for (var i = eBullets.length-1; i >= 0; i--) {
            var eb = eBullets[i]; eb.x += eb.vx; eb.y += eb.vy;
            if (player.inv <= 0 && Math.hypot(eb.x-player.x, eb.y-player.y) < 14) {
                eBullets.splice(i,1); hitPlayer(); continue;
            }
            if (eb.y > 660 || eb.x < -20 || eb.x > 500) eBullets.splice(i,1);
        }

        // Spawning
        spawning();

        // Enemies
        for (var i = enemies.length-1; i >= 0; i--) {
            var e = enemies[i];

            if (e === boss) {
                // Smooth Boss Entrance
                if (e.y < 95) {
                    e.y += 1.4;
                } else {
                    // Unique AI & Attack Movements per Boss Phase
                    e.st++;
                    e.subTimer++;

                    if (e.phaseType === 0) {
                        // ── FASE 1: BURITAN KAPAL (Rear Engines / Stern) ────────────────
                        var bSpeed = 1.6 + Math.min(e.tier * 0.25, 1.5);
                        e.x += e.dir * bSpeed;
                        if (e.x < 110 || e.x > 370) e.dir *= -1;

                        if (e.subTimer > 180) { e.subTimer = 0; e.atkPattern = (e.atkPattern + 1) % 3; }

                        if (e.st > Math.max(20, 32 - e.tier * 2)) {
                            e.st = 0;
                            snd('enemy_shoot');

                            if (e.atkPattern === 0) {
                                // Plasma Thruster Exhaust Burn (3 vertical columns from thruster nozzles)
                                [-48, 0, 48].forEach(function(offX) {
                                    eBullets.push({ x: e.x + offX, y: e.y + 36, vx: 0, vy: 5.5 });
                                    eBullets.push({ x: e.x + offX, y: e.y + 44, vx: 0, vy: 4.6 });
                                });
                            } else if (e.atkPattern === 1) {
                                // Flak Flare Ring Spread (7 bullets in fan arc)
                                for (var a = -3; a <= 3; a++) {
                                    eBullets.push({
                                        x: e.x + a * 12,
                                        y: e.y + 32,
                                        vx: a * 1.2,
                                        vy: 4.2
                                    });
                                }
                            } else {
                                // Alternating Heavy Blasters aimed at player
                                var ang = Math.atan2(player.y - (e.y + 20), player.x - e.x);
                                eBullets.push({ x: e.x - 25, y: e.y + 25, vx: Math.cos(ang - 0.12) * 5.0, vy: Math.sin(ang - 0.12) * 5.0 });
                                eBullets.push({ x: e.x + 25, y: e.y + 25, vx: Math.cos(ang + 0.12) * 5.0, vy: Math.sin(ang + 0.12) * 5.0 });
                            }
                        }
                    } else if (e.phaseType === 1) {
                        // ── FASE 2: LAMBUNG KIRI (Port Hull & Broadside) ────────────────
                        e.x += e.dir * 1.5;
                        if (e.x < 120 || e.x > 260) e.dir *= -1;

                        if (e.subTimer > 170) { e.subTimer = 0; e.atkPattern = (e.atkPattern + 1) % 3; }

                        if (e.st > Math.max(18, 28 - e.tier * 2)) {
                            e.st = 0;
                            snd('enemy_shoot');

                            if (e.atkPattern === 0) {
                                // Broadside Artillery Sweep (left-to-right sweeping volley)
                                for (var a = -2; a <= 3; a++) {
                                    eBullets.push({
                                        x: e.x + a * 18,
                                        y: e.y + 28,
                                        vx: a * 0.9 + 1.2, // angled toward right
                                        vy: 4.0
                                    });
                                }
                            } else if (e.atkPattern === 1) {
                                // VLS Cruise Energy Rockets (launching up and curving down)
                                [-30, 10, 45].forEach(function(offX, idx) {
                                    eBullets.push({
                                        x: e.x + offX,
                                        y: e.y + 15,
                                        vx: (idx - 1) * 1.6,
                                        vy: 4.8
                                    });
                                });
                            } else {
                                // Concentrated Port Armor Deflector Beam (triple angled laser)
                                for (var k = -1; k <= 1; k++) {
                                    eBullets.push({ x: e.x + k * 14, y: e.y + 35, vx: k * 0.8, vy: 5.2 });
                                }
                            }
                        }
                    } else if (e.phaseType === 2) {
                        // ── FASE 3: LAMBUNG KANAN (Starboard Carrier & Railguns) ────────
                        e.x += e.dir * 1.5;
                        if (e.x < 220 || e.x > 360) e.dir *= -1;

                        if (e.subTimer > 170) { e.subTimer = 0; e.atkPattern = (e.atkPattern + 1) % 3; }

                        if (e.st > Math.max(18, 28 - e.tier * 2)) {
                            e.st = 0;
                            snd('enemy_shoot');

                            if (e.atkPattern === 0) {
                                // High-Velocity Starboard Railgun Sniping (high speed red lasers)
                                var ang = Math.atan2(player.y - (e.y + 30), player.x - (e.x + 20));
                                eBullets.push({ x: e.x + 20, y: e.y + 30, vx: Math.cos(ang) * 6.5, vy: Math.sin(ang) * 6.5 });
                                eBullets.push({ x: e.x - 20, y: e.y + 30, vx: Math.cos(ang - 0.15) * 5.8, vy: Math.sin(ang - 0.15) * 5.8 });
                            } else if (e.atkPattern === 1) {
                                // Drone Hangar Launch (spawns 1 interceptor drone if fewer than 2 active)
                                var drones = enemies.filter(function(en) { return en.type === 'interceptor'; });
                                if (drones.length < 2) {
                                    enemies.push({
                                        type: 'interceptor',
                                        x: e.x - 30,
                                        y: e.y + 40,
                                        w: 22,
                                        h: 22,
                                        hp: 2,
                                        sy: 4.5,
                                        sX: -1.5,
                                        tgt: false
                                    });
                                }
                                // Crossfire spray
                                for (var a = -2; a <= 2; a++) {
                                    eBullets.push({ x: e.x + a * 16, y: e.y + 32, vx: a * 1.1, vy: 4.4 });
                                }
                            } else {
                                // Crossfire Battery (angles criss-crossing)
                                eBullets.push({ x: e.x - 40, y: e.y + 25, vx: 2.2, vy: 4.2 });
                                eBullets.push({ x: e.x + 40, y: e.y + 25, vx: -2.2, vy: 4.2 });
                                eBullets.push({ x: e.x, y: e.y + 35, vx: 0, vy: 5.0 });
                            }
                        }
                    } else {
                        // ── FASE 4: HALUAN KAPAL (Command Prow & Spinal Super-Laser Core) ─
                        var bSpeed = 2.0 + Math.min(e.tier * 0.3, 1.8);
                        e.x += e.dir * bSpeed;
                        if (e.x < 110 || e.x > 370) e.dir *= -1;

                        if (e.subTimer > 200) { e.subTimer = 0; e.atkPattern = (e.atkPattern + 1) % 3; }

                        if (e.atkPattern === 0) {
                            // Spinal Super-Laser Core Charge & Blast!
                            e.chargeTimer++;
                            if (e.chargeTimer % 10 === 0 && e.chargeTimer < 70) {
                                spark(e.x, e.y + 38);
                            }
                            if (e.chargeTimer > 70) {
                                e.chargeTimer = 0;
                                snd('bomb');
                                screenShake = 16;
                                // Massive 5-column laser pillar
                                for (var lp = -2; lp <= 2; lp++) {
                                    eBullets.push({ x: e.x + lp * 8, y: e.y + 42, vx: lp * 0.3, vy: 6.2 });
                                }
                                // Side suppressors
                                for (var sa = -3; sa <= 3; sa += 2) {
                                    eBullets.push({ x: e.x + sa * 22, y: e.y + 28, vx: sa * 1.0, vy: 4.2 });
                                }
                            }
                        } else if (e.atkPattern === 1) {
                            // Citadel 360° Rotating Spiral Wave
                            if (e.st > Math.max(16, 24 - e.tier * 2)) {
                                e.st = 0;
                                snd('enemy_shoot');
                                for (var a = -4; a <= 4; a++) {
                                    eBullets.push({
                                        x: e.x + a * 12,
                                        y: e.y + 34,
                                        vx: a * 1.15,
                                        vy: 4.2
                                    });
                                }
                            }
                        } else {
                            // Command Prow Quad-Barrage (heavy rapid bursts)
                            if (e.st > Math.max(14, 20 - e.tier * 2)) {
                                e.st = 0;
                                snd('enemy_shoot');
                                var ang = Math.atan2(player.y - (e.y + 30), player.x - e.x);
                                for (var qb = -1.5; qb <= 1.5; qb += 1) {
                                    eBullets.push({
                                        x: e.x + qb * 16,
                                        y: e.y + 32,
                                        vx: Math.cos(ang + qb * 0.08) * 5.2,
                                        vy: Math.sin(ang + qb * 0.08) * 5.2
                                    });
                                }
                            }
                        }
                    }
                }
            } else if (e.type === 'scout') {
                e.y += e.sy; e.x += e.sX;
                e.st--;
                if (e.st <= 0) {
                    e.st = Math.max(35, 70 - bossIndex * 4);
                    snd('enemy_shoot');
                    eBullets.push({x:e.x, y:e.y+12, vx:0, vy: 4.8 + Math.min(bossIndex * 0.25, 2.0)});
                }
            } else if (e.type === 'bomber') {
                e.y += e.sy; e.x += e.sX;
                if (e.x < 40 || e.x > 440) e.sX *= -1;
                e.st--;
                if (e.st <= 0) {
                    e.st = Math.max(28, 52 - bossIndex * 3);
                    snd('enemy_shoot');
                    var bSpd = 3.8 + Math.min(bossIndex * 0.2, 1.5);
                    eBullets.push({x:e.x-12, y:e.y+18, vx:-1.4, vy:bSpd});
                    eBullets.push({x:e.x, y:e.y+20, vx:0, vy:bSpd+0.4});
                    eBullets.push({x:e.x+12, y:e.y+18, vx:1.4, vy:bSpd});
                }
            } else if (e.type === 'interceptor') {
                if (!e.tgt) {
                    e.tgt = true;
                    var ang = Math.atan2(player.y-e.y, player.x-e.x);
                    var sp = e.spd || 4.8;
                    e.sX = Math.cos(ang) * sp;
                    e.sy = Math.sin(ang) * sp;
                }
                e.x += e.sX; e.y += e.sy;
            }

            // Bullet vs enemy
            for (var j = bullets.length-1; j >= 0; j--) {
                var b = bullets[j];
                if (Math.abs(b.x-e.x) < e.w/2 && Math.abs(b.y-e.y) < e.h/2) {
                    bullets.splice(j,1); e.hp--; spark(b.x, b.y);
                    if (e.hp <= 0) {
                        boom(e.x, e.y, e===boss ? 40 : 10);
                        if (e === boss) {
                            // Boss Defeated!
                            var isFinalPhase = (boss.phaseType === 3);
                            score += isFinalPhase ? (10000 + boss.tier * 5000) : (6000 + boss.tier * 2500);

                            bossDefeatedText = isFinalPhase ?
                                '★ TITAN MOTHERSHIP DESTROYED! ★\nTHREAT ELEVATED TO MK-' + (boss.tier + 1) :
                                '★ SECTION ANNIHILATED! ★\n' + boss.shortName + ' DESTROYED';

                            bossIndex++;
                            nextBossScore = getNextBossScore();
                            bossActive = false;
                            boss = null;
                            bossDefeatedTimer = 150;
                            screenShake = isFinalPhase ? 32 : 24;
                            glitchTimer = 28;

                            // Big multi-explosion effect
                            var boomCount = isFinalPhase ? 12 : 7;
                            for (var k = 0; k < boomCount; k++) {
                                (function(offX, offY, delay) {
                                    setTimeout(function() {
                                        boom(e.x + offX, e.y + offY, 18);
                                    }, delay);
                                })((Math.random()-0.5)*110, (Math.random()-0.5)*60, k * 65);
                            }

                            // Generous Powerup Drops
                            powerups.push({x: e.x - 36, y: e.y, type: 'weapon', vy: 1.4});
                            powerups.push({x: e.x - 12, y: e.y, type: 'life', vy: 1.3});
                            powerups.push({x: e.x + 12, y: e.y, type: 'shield', vy: 1.3});
                            powerups.push({x: e.x + 36, y: e.y, type: 'bomb', vy: 1.4});
                        } else {
                            score += (e.type==='bomber'?250:(e.type==='interceptor'?150:80));
                            
                            // Regular Enemy Powerup Drop Chance (~22%)
                            if (Math.random() < 0.22) {
                                var pRand = Math.random();
                                var pType = 'weapon';
                                if (pRand < 0.35) {
                                    pType = 'weapon';  // 35% Weapon [P]
                                } else if (pRand < 0.60) {
                                    pType = 'bomb';    // 25% Bomb [B]
                                } else if (pRand < 0.82) {
                                    pType = 'life';    // 22% Health/Life [♥]
                                } else {
                                    pType = 'shield';  // 18% Energy Shield [S]
                                }
                                powerups.push({x: e.x, y: e.y, type: pType, vy: 1.8});
                            }
                        }
                        if (score > highScore) { highScore = score; localStorage.setItem('retro2777hi', highScore.toString()); }
                        enemies.splice(i,1); break;
                    }
                }
            }

            // Ram collision
            if (player.inv <= 0 && Math.hypot(e.x-player.x, e.y-player.y) < (e.w/2+12)) {
                hitPlayer();
                if (e !== boss) enemies.splice(i,1);
                continue;
            }

            if (e.y > 680 || e.x < -60 || e.x > 540) enemies.splice(i,1);
        }

        // Powerups
        for (var i = powerups.length-1; i >= 0; i--) {
            var p = powerups[i]; p.y += p.vy;
            if (Math.hypot(p.x-player.x, p.y-player.y) < 26) {
                if (p.type === 'weapon') {
                    snd('powerup');
                    player.weaponLevel = Math.min(3, player.weaponLevel + 1);
                } else if (p.type === 'bomb') {
                    snd('powerup');
                    bombs = Math.min(5, bombs + 1);
                } else if (p.type === 'life') {
                    snd('heal');
                    lives = Math.min(5, lives + 1);
                    for (var k = 0; k < 12; k++) {
                        particles.push({
                            x: player.x,
                            y: player.y,
                            vx: (Math.random() - 0.5) * 5,
                            vy: -(Math.random() * 4 + 2),
                            life: 20,
                            ml: 20,
                            sz: 2.5
                        });
                    }
                } else if (p.type === 'shield') {
                    snd('shield');
                    player.shield = Math.min(3, player.shield + 1);
                    for (var k = 0; k < 16; k++) {
                        var a = (k / 16) * Math.PI * 2;
                        particles.push({
                            x: player.x,
                            y: player.y,
                            vx: Math.cos(a) * 4,
                            vy: Math.sin(a) * 4,
                            life: 20,
                            ml: 20,
                            sz: 2
                        });
                    }
                }
                powerups.splice(i,1); continue;
            }
            if (p.y > 660) powerups.splice(i,1);
        }

        // Particles
        for (var i = particles.length-1; i >= 0; i--) {
            var pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.life--;
            if (pt.life <= 0) particles.splice(i,1);
        }
    }

    // ── Render ────────────────────────────────────────────────────────
    function render() {
        ctx.save();
        if (screenShake > 0.5) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);

        // Background
        ctx.fillStyle = '#050204';
        ctx.fillRect(0,0,CW,CH);

        // Scrolling grid
        ctx.strokeStyle = 'rgba(255,23,68,0.08)';
        ctx.lineWidth = 1;
        var go = (Date.now()*0.08)%40;
        for (var y = go; y < CH; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }
        for (var x = 0; x < CW; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke(); }

        // Stars
        for (var i = 0; i < stars.length; i++) {
            ctx.fillStyle = 'rgba(255,23,68,' + stars[i].b + ')';
            ctx.fillRect(stars[i].x, stars[i].y, stars[i].sz, stars[i].sz*2);
        }

        // Glitch slices
        if (glitchTimer > 0 || Math.random() < 0.12) {
            ctx.fillStyle = Math.random()>0.3?'rgba(255,23,68,0.35)':'rgba(255,0,85,0.25)';
            ctx.fillRect(0, Math.random()*600, CW, Math.random()*20+3);
        }

        // Powerups
        for (var i = 0; i < powerups.length; i++) {
            var p = powerups[i];
            ctx.save(); ctx.translate(p.x, p.y);
            ctx.strokeStyle = '#ff1744'; ctx.fillStyle = '#050204'; ctx.lineWidth = 1.5;
            ctx.fillRect(-11,-11,22,22); ctx.strokeRect(-11,-11,22,22);
            ctx.fillStyle = '#ff1744'; ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            var pLabel = p.type === 'weapon' ? 'P' : (p.type === 'bomb' ? 'B' : (p.type === 'life' ? '♥' : 'S'));
            ctx.fillText(pLabel, 0, 1);
            ctx.restore();
        }

        // Player bullets
        ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ff1744'; ctx.shadowBlur = 8;
        for (var i = 0; i < bullets.length; i++)
            ctx.fillRect(bullets[i].x-1.5, bullets[i].y-7, 3, 14);

        // Enemy bullets
        ctx.fillStyle = '#ff1744'; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 6;
        for (var i = 0; i < eBullets.length; i++) {
            ctx.beginPath(); ctx.arc(eBullets[i].x, eBullets[i].y, 3.5, 0, Math.PI*2); ctx.fill();
        }
        ctx.shadowBlur = 0;

        // Enemies
        for (var i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);

        // Player
        if (lives > 0 && player.inv % 6 < 3) drawPlayer(player.x, player.y);

        // Particles
        for (var i = 0; i < particles.length; i++) {
            var pt = particles[i];
            ctx.fillStyle = 'rgba(255,23,68,' + (pt.life/pt.ml) + ')';
            ctx.fillRect(pt.x-pt.sz/2, pt.y-pt.sz/2, pt.sz, pt.sz);
        }

        // HUD & Overlays
        drawHUD();

        // Boss Warning Overlay
        if (bossWarningTimer > 0 && boss) {
            ctx.save();
            var alertAlpha = (Math.floor(Date.now() / 120) % 2 === 0) ? 0.95 : 0.45;
            ctx.fillStyle = 'rgba(255, 23, 68, ' + (alertAlpha * 0.25) + ')';
            ctx.fillRect(0, 235, CW, 90);
            ctx.strokeStyle = 'rgba(255, 23, 68, ' + alertAlpha + ')';
            ctx.lineWidth = 2;
            ctx.strokeRect(15, 235, CW - 30, 90);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff1744';
            ctx.shadowBlur = 12;
            ctx.fillText('⚠ WARNING: TITAN MOTHERSHIP ⚠', CW / 2, 265);
            ctx.font = 'bold 12px monospace';
            ctx.fillStyle = '#ff1744';
            ctx.fillText(boss.name, CW / 2, 290);
            ctx.fillText('[ TARGET DESIGNATED: ' + boss.shortName + ' ]', CW / 2, 310);
            ctx.restore();
        }

        // Boss Defeated Overlay
        if (bossDefeatedTimer > 0) {
            ctx.save();
            ctx.fillStyle = 'rgba(5, 2, 4, 0.85)';
            ctx.fillRect(15, 235, CW - 30, 90);
            ctx.strokeStyle = '#ff1744';
            ctx.lineWidth = 2;
            ctx.strokeRect(15, 235, CW - 30, 90);

            var lines = bossDefeatedText.split('\n');
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff1744';
            ctx.shadowBlur = 10;
            ctx.fillText(lines[0] || '★ SECTION DESTROYED! ★', CW / 2, 268);
            ctx.font = '12px monospace';
            ctx.fillStyle = '#ff5252';
            ctx.fillText(lines[1] || 'PROCEED TO NEXT TARGET', CW / 2, 295);
            ctx.restore();
        }

        // Game Over
        if (lives <= 0) {
            ctx.fillStyle = 'rgba(5,2,4,0.88)';
            ctx.fillRect(0,0,CW,CH);
            ctx.fillStyle = '#ff1744'; ctx.font = 'bold 26px monospace';
            ctx.textAlign = 'center'; ctx.shadowColor = '#ff1744'; ctx.shadowBlur = 12;
            ctx.fillText('MISSION FAILED', 240, 240);
            ctx.font = '14px monospace'; ctx.fillStyle = '#ffffff';
            ctx.fillText('FINAL SCORE: ' + score, 240, 290);
            ctx.fillText('SECTOR PROGRESS: ' + (bossIndex + 1), 240, 320);
            ctx.fillText('HI-SCORE: ' + highScore, 240, 350);
            ctx.fillStyle = '#ff5252'; ctx.font = 'bold 15px monospace';
            ctx.fillText('[ PRESS SPACE OR TAP TO RESTART ]', 240, 420);
            ctx.shadowBlur = 0;
        }

        ctx.restore();
    }

    function drawPlayer(x, y) {
        ctx.save(); ctx.translate(x, y);

        // Energy Shield Forcefield Visual
        if (player.shield > 0) {
            ctx.save();
            ctx.strokeStyle = '#ff1744';
            ctx.lineWidth = 1.6;
            ctx.shadowColor = '#ff1744';
            ctx.shadowBlur = 10;
            var shieldRot = Date.now() * 0.0035;
            ctx.beginPath();
            for (var s = 0; s < 6; s++) {
                var sa = shieldRot + (s / 6) * Math.PI * 2;
                var sx = Math.cos(sa) * 26;
                var sy = Math.sin(sa) * 26;
                if (s === 0) ctx.moveTo(sx, sy);
                else ctx.lineTo(sx, sy);
            }
            ctx.closePath();
            ctx.stroke();

            // Inner Pulsing Ring
            if (player.shield > 1) {
                ctx.beginPath();
                ctx.arc(0, 0, 21, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        ctx.strokeStyle = '#ff1744'; ctx.fillStyle = '#050204'; ctx.lineWidth = 1.6;
        // Fuselage
        ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(4,-8); ctx.lineTo(4,14); ctx.lineTo(0,18); ctx.lineTo(-4,14); ctx.lineTo(-4,-8); ctx.closePath(); ctx.fill(); ctx.stroke();
        // Wings
        ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(18,0); ctx.lineTo(16,6); ctx.lineTo(-16,6); ctx.closePath(); ctx.fill(); ctx.stroke();
        // Tail booms
        ctx.strokeRect(-12,-4,3,22); ctx.strokeRect(9,-4,3,22);
        // Cockpit
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-1.5,-7,3,6);
        // Engine glow
        ctx.fillStyle = '#ff1744';
        ctx.fillRect(-12,18,3,Math.random()*6+3);
        ctx.fillRect(9,18,3,Math.random()*6+3);
        ctx.restore();
    }

    // ── Dedicated Colossal Spaceship Section Drawing ──────────────────
    function drawEnemy(e) {
        ctx.save(); ctx.translate(e.x, e.y);
        ctx.strokeStyle = '#ff1744'; ctx.fillStyle = '#050204'; ctx.lineWidth = 1.5;

        if (e === boss) {
            if (e.phaseType === 0) {
                // ── BURITAN KAPAL (Rear Engines / Reactor Core) ───────────────
                // Main Heavy Rear Hull Structure
                ctx.beginPath();
                ctx.moveTo(-110, -35);
                ctx.lineTo(110, -35);
                ctx.lineTo(120, 10);
                ctx.lineTo(90, 35);
                ctx.lineTo(-90, 35);
                ctx.lineTo(-120, 10);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // 3 Giant Plasma Thruster Engine Bells at bottom
                [-48, 0, 48].forEach(function(tx) {
                    ctx.strokeRect(tx - 16, 20, 32, 18);
                    ctx.fillStyle = '#ff1744';
                    // Pulsing animated plasma exhaust fire
                    var fireH = Math.random() * 18 + 12;
                    ctx.fillRect(tx - 12, 38, 24, fireH);
                });

                // Reactor conduits & grill lines
                ctx.strokeRect(-80, -25, 40, 20);
                ctx.strokeRect(40, -25, 40, 20);
                ctx.strokeRect(-20, -28, 40, 24);
                ctx.fillStyle = '#ff1744';
                ctx.fillRect(-14, -22, 28, 12);

            } else if (e.phaseType === 1) {
                // ── LAMBUNG KIRI (Port Hull & Broadside Cannon Batteries) ─────
                ctx.beginPath();
                ctx.moveTo(-115, -40);
                ctx.lineTo(80, -25);
                ctx.lineTo(115, 20);
                ctx.lineTo(40, 42);
                ctx.lineTo(-95, 38);
                ctx.lineTo(-125, 5);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // Broadside Cannon Mounts along left edge
                [-30, 0, 30].forEach(function(by) {
                    ctx.strokeRect(-110, by - 6, 22, 12);
                    ctx.fillStyle = '#ff1744';
                    ctx.fillRect(-122, by - 3, 12, 6);
                });

                // VLS Missile Silo Grid on deck
                ctx.strokeRect(-40, -20, 60, 25);
                for (var si = 0; si < 4; si++) {
                    ctx.strokeRect(-35 + si * 14, -16, 10, 16);
                }

            } else if (e.phaseType === 2) {
                // ── LAMBUNG KANAN (Starboard Hull & Carrier Hangar) ───────────
                ctx.beginPath();
                ctx.moveTo(-80, -25);
                ctx.lineTo(115, -40);
                ctx.lineTo(125, 5);
                ctx.lineTo(95, 38);
                ctx.lineTo(-40, 42);
                ctx.lineTo(-115, 20);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // Heavy Starboard Railguns along right edge
                [-25, 15].forEach(function(ry) {
                    ctx.strokeRect(88, ry - 7, 24, 14);
                    ctx.fillStyle = '#ff1744';
                    ctx.fillRect(112, ry - 3, 16, 6);
                });

                // Drone Carrier Launch Bay Deck (Glowing Hangar Doors)
                ctx.strokeRect(-20, -18, 70, 34);
                ctx.fillStyle = 'rgba(255, 23, 68, 0.45)';
                ctx.fillRect(-15, -12, 60, 22);
                ctx.strokeStyle = '#ffffff';
                ctx.strokeRect(-15, -12, 60, 22);

            } else {
                // ── HALUAN UTAMA (Command Prow & Spinal Super-Laser Core) ────
                ctx.beginPath();
                ctx.moveTo(0, 48); // Sharp bow tip pointing down
                ctx.lineTo(125, 15);
                ctx.lineTo(135, -35);
                ctx.lineTo(50, -48);
                ctx.lineTo(-50, -48);
                ctx.lineTo(-135, -35);
                ctx.lineTo(-125, 15);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // Command Bridge Tower with Cyber Visor Windows
                ctx.strokeRect(-40, -40, 80, 24);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-32, -32, 64, 8); // Glowing bridge visor

                // Central Spinal Super-Laser Core at the Prow Tip
                ctx.fillStyle = '#ff1744';
                ctx.beginPath();
                ctx.arc(0, 18, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Dual Heavy Citadel Fortress Wing Cannons
                [-95, 95].forEach(function(wx) {
                    ctx.strokeRect(wx - 14, -15, 28, 25);
                    ctx.fillStyle = '#ff1744';
                    ctx.fillRect(wx - 6, 10, 12, 16);
                });
            }

        } else if (e.type === 'bomber') {
            ctx.beginPath(); ctx.moveTo(0,18); ctx.lineTo(24,0); ctx.lineTo(20,-14); ctx.lineTo(0,-18); ctx.lineTo(-20,-14); ctx.lineTo(-24,0); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.strokeRect(-6,-4,12,10);
        } else if (e.type === 'interceptor') {
            ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(11,-12); ctx.lineTo(0,-7); ctx.lineTo(-11,-12); ctx.closePath(); ctx.fill(); ctx.stroke();
        } else {
            ctx.beginPath(); ctx.moveTo(0,12); ctx.lineTo(12,-8); ctx.lineTo(-12,-8); ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
    }

    function drawHUD() {
        ctx.fillStyle = '#ff1744'; ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('SCORE: ' + score, 16, 22);
        ctx.textAlign = 'right';
        ctx.fillText('HI: ' + highScore, 464, 22);

        // Stage & Next Boss Tracker
        ctx.textAlign = 'left';
        ctx.fillText('SECTOR ' + (bossIndex + 1), 16, 38);
        ctx.textAlign = 'right';
        if (!bossActive) {
            ctx.fillText('NEXT BOSS: ' + nextBossScore, 464, 38);
        } else {
            ctx.fillStyle = '#ff4569';
            ctx.fillText('⚠ ' + boss.shortName + ' ⚠', 464, 38);
        }

        // Lives & Shields
        ctx.fillStyle = '#ff1744';
        ctx.textAlign = 'left';
        ctx.fillText('LIVES:', 16, 54);
        for (var i = 0; i < lives; i++) {
            ctx.strokeStyle = '#ff1744';
            ctx.strokeRect(62+i*16,45,10,10);
            ctx.fillRect(65+i*16,48,4,4);
        }

        // Shield Indicator in HUD
        if (player.shield > 0) {
            ctx.fillStyle = '#ff1744';
            ctx.fillText('SHIELD:', 16, 70);
            for (var s = 0; s < player.shield; s++) {
                ctx.strokeStyle = '#ff1744';
                ctx.strokeRect(70 + s * 16, 61, 10, 10);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(73 + s * 16, 64, 4, 4);
            }
        }

        ctx.fillStyle = '#ff1744';
        ctx.textAlign = 'right';
        ctx.fillText('BOMBS: ' + bombs, 464, 54);

        // Boss Health Bar at Top when Boss is Active
        if (bossActive && boss) {
            var barW = 320, barH = 10, barX = (CW - barW) / 2, barY = 56;
            var hpPct = Math.max(0, boss.hp / boss.maxHp);

            ctx.fillStyle = 'rgba(5, 2, 4, 0.9)';
            ctx.fillRect(barX - 6, barY - 18, barW + 12, barH + 26);
            ctx.strokeStyle = '#ff1744';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(barX - 6, barY - 18, barW + 12, barH + 26);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('⚠ ' + boss.shortName + ' [' + Math.max(0, boss.hp) + '/' + boss.maxHp + '] ⚠', CW / 2, barY - 5);

            ctx.fillStyle = 'rgba(255, 23, 68, 0.25)';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = '#ff1744';
            ctx.fillRect(barX, barY, barW * hpPct, barH);
            ctx.strokeRect(barX, barY, barW, barH);
        }
    }

    // ── Main Loop ────────────────────────────────────────────────────
    reset();
    getAudio();
    initBGM();

    function loop() {
        requestAnimationFrame(loop);
        update();
        render();
    }
    loop();

})();
</script>
</body>
</html>
