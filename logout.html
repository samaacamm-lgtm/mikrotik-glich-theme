<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />   
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet hotspot - Log out</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        function getLoginUrl() {
            var mikrotikUrl = '$(link-login)';
            if (!mikrotikUrl || mikrotikUrl.indexOf('$(') === 0 || mikrotikUrl.indexOf('$') !== -1) {
                return 'login.html';
            }
            return mikrotikUrl;
        }

        function doReconnect() {
            var dest = getLoginUrl();
            if (window.triggerPageTransition) {
                window.triggerPageTransition(function () {
                    window.location.href = dest;
                });
                return false;
            }
            window.location.href = dest;
            return false;
        }
    </script>
</head>

<body>
    <div class="scanlines"></div>

    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap animated fadeIn logout-wrap">

                <div class="logout-top-bar">
                    <div class="logout-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2V12" stroke="#ff1744" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M17.65 6.35C19.1 7.8 20 9.8 20 12C20 16.42 16.42 20 12 20C7.58 20 4 16.42 4 12C4 9.8 4.9 7.8 6.35 6.35" stroke="#ff1744" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                    </div>

                    <div class="logout-title-group">
                        <h1 class="glitch-hover logout-title">LOGGED OUT</h1> 
                        <div class="status-badge" style="border-color: rgba(255, 23, 68, 0.7); margin-bottom: 0;">
                            <span class="pulse-dot" style="background-color: #ff3366;"></span> SESSION TERMINATED
                        </div>
                    </div>
                </div>

                <div class="session-stats-grid">
                    <div class="stat-chip">
                        <span class="stat-chip-label">Session Time</span>
                        <span class="stat-chip-val">$(uptime)</span>
                    </div>
                    <div class="stat-chip">
                        <span class="stat-chip-label">Total Traffic</span>
                        <span class="stat-chip-val">$(bytes-in-nice) / $(bytes-out-nice)</span>
                    </div>
                </div>

                <table class="hud-table">  
                    <tr>
                        <td><span class="hud-label">User Account</span></td>
                        <td><span class="hud-value">$(username)</span></td>
                    </tr>
                    <tr>
                        <td><span class="hud-label">IP Address</span></td>
                        <td><span class="hud-value">$(ip)</span></td>
                    </tr>
                    <tr>
                        <td><span class="hud-label">MAC Address</span></td>
                        <td><span class="hud-value">$(mac)</span></td>
                    </tr>
                    $(if session-time-left)
                    <tr>
                        <td><span class="hud-label">Remaining Time</span></td>
                        <td><span class="hud-value">$(session-time-left)</span></td>
                    </tr>
                    $(endif)
                </table>

                <form action="$(link-login)" name="login" method="get" onSubmit="return doReconnect()" class="logout-action-form">
                    <input type="submit" value="RECONNECT / LOG IN" class="logout-reconnect-btn" />
                </form>

                <p class="info bt glitch-hover">SESSION ENDED &bull; MIKROTIK ROUTEROS</p>
            </div>
        </div>
    </div>
    <script src="glitch.js"></script>
    <script src="game.js"></script>
</body>

</html>
