<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet hotspot - Error</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="scanlines"></div>

    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap animated fadeIn error-wrap" style="text-align: center;">
                <div class="status-badge" style="border-color: #ff1744;">
                    <span class="pulse-dot"></span> SYSTEM ALERT
                </div>

                <h1 class="glitch-hover" style="color: #ff3366;">ERROR ENCOUNTERED</h1>
                
                <p class="info alert" style="margin-bottom: 20px;">
                    $(error)
                </p>

                <p class="info">
                    Return to authentication portal:<br />
                    <a class="cyber-link" href="$(link-login)">Click here to Login</a>
                </p>

                <p class="info bt glitch-hover">HOTSPOT GATEWAY &bull; MIKROTIK ROUTEROS</p>
            </div>
        </div>
    </div>
    <script src="glitch.js"></script>
</body>

</html>
